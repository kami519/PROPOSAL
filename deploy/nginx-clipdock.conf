# ClipDock 反向代理示例（Ubuntu 24.04 / Nginx）
# 放到 /etc/nginx/sites-available/clipdock 并 softlink 到 sites-enabled。
# 有域名时把 server_name 改成域名，并用 certbot 申请证书：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d your.domain.com

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.221.244.234;

    # 视频中转可能较大；默认 4GB，与 MAX_FILESIZE_BYTES 对齐。
    client_max_body_size 4g;
    client_body_timeout 300s;

    # 代理上传/下载容易超时，放宽到 1 小时。
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    # 关闭代理缓冲，避免大文件下载先写满临时盘。
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查不需要走应用日志。
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
