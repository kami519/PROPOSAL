# ClipDock reverse proxy for Ubuntu 24.04.
#
# Two supported modes:
#   1. Standalone (default): this file is installed as the active Nginx site.
#   2. Behind BaoTa (BT-Panel): the panel owns Nginx, so copy this server block
#      into the "反向代理"/"配置文件" of the site created in the panel, or paste
#      it into /www/server/panel/vhost/nginx/clipdock.conf and restart Nginx.
#
# TLS: add certificates in BaoTa or run:
#   certbot --nginx -d your.domain.com

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Keep in sync with MAX_FILESIZE_BYTES (default deploy value is 2 GiB).
    client_max_body_size 4g;
    client_body_timeout 300s;

    # Downloads and AI summaries can run for a long time through the proxy.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    # Stream large files instead of buffering them on the small system disk.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
